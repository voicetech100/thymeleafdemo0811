<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Show Images</title>
</head>
<body>

	<!-- th:switch - 多重條件 -->
	<p>當前角色：<span th:text="${role}">預覽文字</span></p>
	<div th:switch="${role}">
	    <p th:case="'admin'">管理員面板</p>
	    <p th:case="'user'">使用者面板</p>
	    <p th:case="*">未知角色</p>
	</div>

</body>
</html>
